name: Update events from Time.ir

# Once a month (and on demand) fetch the yearly Time.ir page and commit src/data/events-<year>.json.
# The app downloads that file from your repository (see src/lib/events-config.ts), so phones get the
# new Persian year without a new APK.
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch events from Time.ir
        run: node scripts/update-events-from-timeir.mjs
      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events from Time.ir"
            git push
          fi
