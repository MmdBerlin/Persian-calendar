name: Build Persian Calendar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Project.zip"
      - "project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname 'project.zip' | head -n 1)"
          test -n "$ZIP" || { echo "project.zip not found"; ls -la; exit 1; }
          mkdir -p extracted
          unzip -o -q "$ZIP" -d extracted
          PKG="$(find extracted -name package.json -not -path '*/node_modules/*' | head -n 1)"
          test -n "$PKG" || { echo "package.json not found"; find extracted | head -50; exit 1; }
          echo "SOURCE_DIR=$GITHUB_WORKSPACE/$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app for static export
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          rm -f src/app/api/route.ts
          cat > capacitor.config.ts <<'CFG'
          import type { CapacitorConfig } from "@capacitor/cli";
          const config: CapacitorConfig = {
            appId: "ir.persiancalendar.offline",
            appName: "Persian Calendar",
            webDir: "out",
          };
          export default config;
          CFG

      - name: Install dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install --legacy-peer-deps

      - name: Build web app
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm run build

      - name: Add Android
        working-directory: ${{ env.SOURCE_DIR }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.SOURCE_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.SOURCE_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: persian-calendar-apk
          path: ${{ env.SOURCE_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
