name: Build Android APK

# ─────────────────────────────────────────────────────────────────────────────
# ساخت APK امضاشده از سورس (همان کلید هر بار، پس آپدیت روی نسخه قبلی نصب می شود)
#
# لازم است ۴ راز (Secret) در تنظیمات مخزن ست شده باشد:
#   Settings → Secrets and variables → Actions → New repository secret
#
#   KEYSTORE_BASE64    ← خروجی دستور:  base64 -w0 my-release.keystore
#   KEYSTORE_PASSWORD  ← رمز keystore
#   KEY_ALIAS          ← calendar
#   KEY_PASSWORD       ← رمز کلید
#
# فایل my-release.keystore را هرگز کامیت نکنید!
#
# خروجی هر بیلد:
#   app-release.apk  → نصب مستقیم روی گوشی (از بخش Artifacts همین اجرا دانلود کنید)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # با هر اجرا یکی زیاد می شود؛ اندروید فقط شماره بالاتر را به عنوان آپدیت می پذیرد
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI نسخه جدید Node 22 یا بالاتر می خواهد
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build web app (static export to out/)
        run: npm run build

      - name: Add Android project
        run: npx cap add android

      # آیکون ها، اسپلش، مجوزها، تنظیمات امضا و نسخه را به پروژه اندروید اضافه می کند
      - name: Patch Android project (icons, splash, permissions, signing, version)
        run: node scripts/patch-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      # ─── کلید امضا: همیشه همان کلید، تا نسخه جدید روی نسخه قبلی نصب شود ───
      - name: Prepare signing key (my-release.keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::راز KEYSTORE_BASE64 ست نشده است. فایل keystore را به base64 تبدیل کنید و همراه KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD در Secrets بگذارید."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/my-release.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/my-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::فایل keystore با رمز داده شده باز نشد؛ KEYSTORE_PASSWORD را چک کنید."; exit 1; }

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Check the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK امضاشده پیدا نشد (رمز keystore درست است؟)"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: persian-calendar-release
          path: android/app/build/outputs/apk/release/app-release.apk
